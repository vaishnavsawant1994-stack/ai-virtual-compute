name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stage0-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qualify Stage 0
        run: python scripts/qualify_stage0.py
